name: CI/CD Deploy (GHCR + Dokploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dev-mindware/connect-2026-api
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9

jobs:
  api-ci:
    name: API — Quality, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d connect_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3010
      MAX_REGISTRATIONS: 200
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/connect_test
      FRONTEND_URL: http://127.0.0.1:5173
      TICKET_SECRET: ci-ticket-secret-must-be-at-least-32-characters-long
      ADMIN_API_KEY: ci-admin-checkin-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema validation
        run: pnpm prisma:validate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply DB migrations
        run: pnpm prisma:migrate:deploy

  frontend-ci:
    name: Frontend — Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend
        run: pnpm verify

  build-and-push-image:
    name: Build & Push API Image to GHCR
    if: github.event_name != 'pull_request'
    needs: [api-ci, frontend-ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Trigger Dokploy Redeploy
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy webhook
        if: ${{ secrets.DOKPLOY_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering redeploy on Dokploy..."
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" -f
