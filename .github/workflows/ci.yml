name: CI/CD Deploy (GHCR + Dokploy)

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dev-mindware/connect-2026-api
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9

jobs:
  ci:
    name: CI — Quality, Tests & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d connect_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: test
      PORT: 3030
      MAX_REGISTRATIONS: 200
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/connect_test
      FRONTEND_URL: http://127.0.0.1:5173
      TICKET_SECRET: ci-ticket-secret-must-be-at-least-32-characters-long
      ADMIN_API_KEY: ci-admin-checkin-key

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Static quality gates ─────────────────────────────────────────────────
      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma schema validation
        run: pnpm prisma:validate

      - name: Build
        run: pnpm build

      # ── Dependency security audit ────────────────────────────────────────────
      - name: Security audit (prod deps, high+)
        run: pnpm audit --prod --audit-level=high

      # ── Unit tests ───────────────────────────────────────────────────────────
      - name: Unit tests
        run: pnpm test

      # ── Smoke tests (production bundle + Postgres) ───────────────────────────
      - name: Apply DB migrations
        run: pnpm prisma:migrate:deploy

      - name: Start API (production bundle)
        run: nohup pnpm start:prod > e2e-server.log 2>&1 & echo $! > e2e-server.pid

      - name: Wait for API to be healthy
        run: |
          for i in {1..30}; do
            if ! kill -0 $(cat e2e-server.pid) 2>/dev/null; then
              echo "=== API process terminated unexpectedly ==="
              cat e2e-server.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:3030/ > /tmp/api-root.txt; then exit 0; fi
            sleep 2
          done
          echo "=== API timed out waiting to start ==="
          cat e2e-server.log
          exit 1

      - name: Smoke checks (root + health + status)
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:3030/ | grep -q "connect-2026-api"
          curl --fail --silent http://127.0.0.1:3030/api/health | grep -q "connected"
          curl --fail --silent http://127.0.0.1:3030/api/status | grep -q "maxRegistrations"

      - name: Upload API logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-logs
          path: api/e2e-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop API
        if: always()
        run: |
          if test -f e2e-server.pid; then kill "$(cat e2e-server.pid)" || true; fi

  build-and-push-image:
    name: Build & Push Image to GHCR
    # Só corre em push para main (não em PRs)
    if: github.event_name != 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-vps:
    name: Trigger Dokploy Redeploy
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Dokploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "DOKPLOY_WEBHOOK_URL secret is not set; skipping Dokploy redeploy."
            exit 0
          fi
          echo "Triggering redeploy on Dokploy..."
          curl -X POST "$DOKPLOY_WEBHOOK_URL" -f
