# ==============================================================================
# 🚀 DOCKER COMPOSE — AMBIENTE DE PRODUÇÃO (CONNECT 2026 API & POSTGRESQL)
# ==============================================================================
# Uso manual no servidor:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# No Dokploy (Source: Docker Raw):
#   O Dokploy gera automaticamente o ficheiro .env a partir da aba Environment.
# ==============================================================================

services:
  connect-api:
    image: ghcr.io/${GHCR_OWNER:-dev-mindware}/connect-2026-api:latest
    pull_policy: always
    container_name: connect_2026_api_prod
    restart: unless-stopped
    ports:
      - "${PORT:-3030}:3030"
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-connect2026}?schema=public}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PORT=${PORT:-3030}
      - MAX_REGISTRATIONS=${MAX_REGISTRATIONS:-200}
      - FRONTEND_URL=${FRONTEND_URL}
      - TICKET_SECRET=${TICKET_SECRET}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - connect_net_prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3030/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  postgres:
    image: postgres:16-alpine
    container_name: connect_2026_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - connect_pgdata_prod:/var/lib/postgresql/data
    networks:
      - connect_net_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: >
      postgres
        -c max_connections=150
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  connect_net_prod:
    driver: bridge
    name: connect_net_prod

volumes:
  connect_pgdata_prod:
    name: connect_pgdata_prod
